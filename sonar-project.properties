# sonar-project.properties
# SonarQube configuration for GlobalPay Portal
# This tells SonarQube what to scan and how

sonar.projectKey=globalpay-portal
sonar.projectName=GlobalPay International Payments Portal
sonar.projectVersion=1.0

# Source files to scan
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,**/*.test.js,**/coverage/**

# Language
sonar.language=js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Security — SonarQube will check for:
# - Hardcoded credentials
# - XSS vulnerabilities
# - Injection flaws
# - Insecure randomness
# - Weak cryptography
