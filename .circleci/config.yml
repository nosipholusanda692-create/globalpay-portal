# .circleci/config.yml
version: 2.1

orbs:
  node: circleci/node@5.2.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  build-and-audit:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Run npm security audit
          command: npm audit --audit-level=high
      - run:
          name: Build production app
          command: npm run build
          environment:
            CI: "false"
      - persist_to_workspace:
          root: .
          paths:
            - build
            - node_modules

  sonarqube-scan:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - attach_workspace:
          at: .
      - sonarcloud/scan:
          sonar_token_variable_name: SONAR_TOKEN

  deploy:
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install Firebase CLI
          command: sudo npm install -g firebase-tools
      - run:
          name: Deploy to Firebase Hosting (HTTPS)
          command: firebase deploy --only hosting --token "$FIREBASE_TOKEN"

workflows:
  secure-build-deploy:
    jobs:
      - build-and-audit:
          filters:
            branches:
              only: main
      - sonarqube-scan:
          requires:
            - build-and-audit
          context: SonarCloud
          filters:
            branches:
              only: main
      - deploy:
          requires:
            - sonarqube-scan
          filters:
            branches:
              only: main